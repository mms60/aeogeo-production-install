name: Eyebrow consistency

on:
  push:

jobs:
  eyebrow-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Run eyebrow consistency test
        run: node --test tests/eyebrow-consistency.test.cjs
